# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
guava = "33.4.5-jre"
junit-jupiter = "5.12.1"
spring-boot = "3.2.5"
springdoc-openapi = "2.4.0"
mysql = "8.3.0"
lombok = "1.18.32"
modelmapper = "3.2.0"
datafaker = "2.1.0"
spring-ai = "1.0.0-M7"

[libraries]
guava = { module = "com.google.guava:guava", version.ref = "guava" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }

# Spring Boot
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "spring-boot" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux", version.ref = "spring-boot" }
spring-boot-starter-data-r2dbc = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc", version.ref = "spring-boot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }

# R2DBC MySQL Driver
r2dbc-mysql = { module = "io.asyncer:r2dbc-mysql", version = "1.1.0" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }

# Swagger/OpenAPI for WebFlux
springdoc-openapi-starter-webflux-ui = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc-openapi" }

# Lombok
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# ModelMapper
modelmapper = { module = "org.modelmapper:modelmapper", version.ref = "modelmapper" }

# DataFaker
datafaker = { module = "net.datafaker:datafaker", version.ref = "datafaker" }

# Spring AI Ollama Starter
spring-ai-ollama-starter = { module = "org.springframework.ai:spring-ai-ollama-spring-boot-starter", version.ref = "spring-ai" }
