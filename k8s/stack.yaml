---
# Optional: Ingress to expose a single entrypoint with path-based routing.
# Requires an Ingress controller (e.g., nginx). Adjust host as needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fuel50-ingress
  namespace: fuel50
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: fuel50.local
      http:
        paths:
          - path: /company
            pathType: Prefix
            backend:
              service:
                name: company-service
                port:
                  number: 8080
          - path: /user
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8080
          - path: /activity
            pathType: Prefix
            backend:
              service:
                name: activity-service
                port:
                  number: 8080
          - path: /action
            pathType: Prefix
            backend:
              service:
                name: action-service
                port:
                  number: 8080
          - path: /rating
            pathType: Prefix
            backend:
              service:
                name: rating-service
                port:
                  number: 8080
          - path: /prompt
            pathType: Prefix
            backend:
              service:
                name: data-generator-service
                port:
                  number: 8080