apiVersion: v1
kind: Namespace
metadata:
  name: fuel50
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fuel50-config
  namespace: fuel50
data:
  # Default service port used in Kubernetes (ClusterIP services expose 8080)
  SERVER_PORT: "8080"
  # R2DBC connection string pointing to MySQL service inside the cluster
  SPRING_R2DBC_URL: "r2dbc:mysql://mysql:3306/fuel50"
  SPRING_R2DBC_USERNAME: "app_user"
  SPRING_SQL_INIT_MODE: "never"
  # Ollama (LLM API) base URL used by data-generator-service
  SPRING_AI_OLLAMA_BASE_URL: "http://ollama:11434/"
  SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL: "llama3"
  SPRING_AI_OLLAMA_CHAT_OPTIONS_TEMPERATURE: "0.0"
  # Client base URLs for data-generator-service (service discovery via DNS)
  CLIENTS_COMPANY_BASE_URL: "http://company-service:8080"
  CLIENTS_USER_BASE_URL: "http://user-service:8080"
  CLIENTS_ACTIVITY_BASE_URL: "http://activity-service:8080"
  CLIENTS_ACTION_BASE_URL: "http://action-service:8080"
  CLIENTS_USER_ACTIVITY_BASE_URL: "http://activity-service:8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: fuel50-secrets
  namespace: fuel50
type: Opaque
stringData:
  SPRING_R2DBC_PASSWORD: "app_password"
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: fuel50
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: fuel50
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: "fuel50"
            - name: MYSQL_USER
              value: "app_user"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fuel50-secrets
                  key: SPRING_R2DBC_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              value: "changeme"
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: fuel50
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: fuel50
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_MODEL
              value: "llama3"
          command: ["/bin/sh","-lc"]
          args:
            - >
              ollama serve &
              for i in $(seq 1 30);
              do curl -sSf http://localhost:11434/api/version && break || sleep 1;
              done;
              ollama pull ${OLLAMA_MODEL};
              wait
---
apiVersion: v1
kind: Service
metadata:
  # MySQL service provides stable DNS name for DB access
  name: mysql
  namespace: fuel50
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
